
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLOBAL UPDATE</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #090909;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #111;
  padding: 18px;
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid #292929;
}

.logo {
  color: #ff3030;
  font-size: 25px;
  font-weight: bold;
}

nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.search {
  width: 55%;
  padding: 10px;
  background: #222;
  border: 1px solid #444;
  border-radius: 8px;
  color: white;
}

.hero {
  padding: 35px 20px;
  background: linear-gradient(135deg, #300000, #111, #000);
}

.hero h1 {
  color: #ff3030;
  margin-bottom: 12px;
}

.hero p {
  color: #ddd;
  margin-bottom: 18px;
}

.btn {
  background: #ff3030;
  border: none;
  color: white;
  padding: 12px 20px;
  border-radius: 7px;
  font-weight: bold;
  cursor: pointer;
}

.section {
  padding: 20px;
}

.section h2 {
  margin-bottom: 18px;
}

.videos {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.card {
  background: #181818;
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
}

.thumbnail {
  height: 145px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #410000, #222, #111);
  color: #ff3030;
  font-size: 35px;
}

.card h3 {
  font-size: 14px;
  padding: 12px;
}

.card p {
  color: #999;
  font-size: 12px;
  padding: 0 12px 12px;
}

footer {
  text-align: center;
  padding: 30px;
  color: #888;
  font-size: 13px;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  z-index: 100;
  padding: 20px;
  overflow: auto;
}

.modal-content {
  max-width: 800px;
  margin: 40px auto;
}

.modal video {
  width: 100%;
  background: black;
}

.close {
  float: right;
  font-size: 30px;
  color: white;
  cursor: pointer;
  margin-bottom: 15px;
}

#videoTitle {
  margin: 15px 0;
}

.notice {
  background: #222;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 20px;
  color: #bbb;
  font-size: 13px;
}

@media (min-width: 700px) {
  .videos {
    grid-template-columns: repeat(4, 1fr);
  }
  .thumbnail {
    height: 180px;
  }
}
</style>
</head>

<body>

<header>
<nav>
<div class="logo">GLOBAL UPDATE</div>
<input class="search" type="search"
id="search" placeholder="Tafuta video...">
</nav>
</header>

<section class="hero">
<h1>GLOBAL UPDATE</h1>
<p>Karibu kwenye jukwaa letu la video.</p>
<button class="btn" onclick="document.getElementById('catalog').scrollIntoView()">
  Tazama Video
</button>
</section>

<section class="section">
<div class="notice">
  <strong>18+ </strong>
  Tovuti hii inaweza kuwa na maudhui ya watu wazima.
  Tumia maudhui halali na yaliyowekwa kwa ruhusa.
</div>

<h2 id="catalog">Video Zilizopo</h2>

<div class="videos" id="videos"></div>
</section>

<footer>
<p>GLOBAL UPDATE &copy; 2026</p>
<p>All rights reserved.</p>
</footer>

<div class="modal" id="player">
<div class="modal-content">
<span class="close" onclick="closePlayer()">&times;</span>
<h2 id="videoTitle"></h2>
<video id="videoPlayer" controls playsinline></video>
</div>
</div>

<script>
const videoList = [
  {
    title: "Video 1",
    description: "Video mpya",
    url: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
  },
  {
    title: "Video 2",
    description: "Video mpya",
    url: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
  },
  {
    title: "Video 3",
    description: "Video mpya",
    url: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
  },
  {
    title: "Video 4",
    description: "Video mpya",
    url: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
  }
];

const container = document.getElementById("videos");

function displayVideos(items) {
  container.innerHTML = "";

  items.forEach(video => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="thumbnail">▶</div>
      <h3></h3>
      <p></p>
    `;

    card.querySelector("h3").textContent = video.title;
    card.querySelector("p").textContent = video.description;

    card.onclick = () => openPlayer(video);

    container.appendChild(card);
  });
}

function openPlayer(video) {
  document.getElementById("player").style.display = "block";
  document.getElementById("videoTitle").textContent = video.title;

  const player = document.getElementById("videoPlayer");
  player.src = video.url;
  player.load();
  player.play().catch(() => {});
}

function closePlayer() {
  const player = document.getElementById("videoPlayer");
  player.pause();
  player.src = "";
  document.getElementById("player").style.display = "none";
}

document.getElementById("search").addEventListener("input", function() {
  const query = this.value.toLowerCase();

  const filtered = videoList.filter(video =>
    video.title.toLowerCase().includes(query)
  );

  displayVideos(filtered);
});

displayVideos(videoList);
</script>

</body>
  </html>
